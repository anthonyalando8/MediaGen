# Dockerized dev stack for the 3 runtime services: editor, api, python.
# (infra/docker-compose.yml is separate — Postgres/MinIO for a later phase;
# apps/api doesn't use them yet, see apps/api/src/db/schema.ts.)
#
# Usage:
#   docker compose up --build
#     -> dev mode (docker-compose.override.yml auto-merges: hot reload,
#        source bind-mounted, tsx watch / vite / uvicorn --reload)
#
#   docker compose -f docker-compose.yml up --build
#     -> prod mode (this file alone: built/bundled output, no source
#        bind-mounts for api/editor, no --reload)
#
# Ollama: src/llm.py shells out to the `ollama` CLI. The python container
# does NOT run its own Ollama daemon — OLLAMA_HOST below points it at the
# HOST machine's Ollama (must already be running/authenticated there).
# On Windows/Mac Docker Desktop, host.docker.internal reaches the host; if
# your host Ollama only listens on 127.0.0.1 and this doesn't connect, set
# OLLAMA_HOST=0.0.0.0 on the host Ollama instance.
services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: prod
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/projects').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  python:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      target: prod
    ports:
      - "8000:8000"
    environment:
      OLLAMA_HOST: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Code, config.yaml, prompts/, data/, model files — all local-only /
      # too heavy to bake into the image (see docker/python.Dockerfile).
      - ./apps/python:/app/apps/python
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  editor:
    build:
      context: .
      dockerfile: docker/editor.Dockerfile
      target: prod
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:3001
      VITE_SCENE_API: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
      python:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

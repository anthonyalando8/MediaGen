id: listicle_top5
label: "Listicle (Top 5, vertical)"
description: "A ranked countdown — hook, five numbered item beats, payoff, closing question. The simplest non-explainer format: it maps onto the existing beat-type union with no new vocabulary, and its number-led keywords are exactly what stat_callout / _derive_stat_items were built for (see scene_export.py). Portrait."

default_resolve_visuals: true

# One beat per item is the whole point of the format — 5 items + hook + payoff
# + cta = 8 typical. The range allows a top-3 through a top-7 without a second
# pack, and llm.py's _flatten_sections is a no-op here (flat beat list).
beats: { min: 7, max: 13 }
words_per_beat: { min: 12, max: 24 }
total_words: { min: 110, max: 230 }
require_emphasis: true

variety:
  min_cameras: 3
  min_paces: 2
  min_layouts: 2
  max_consecutive_camera: 2
  # A countdown is structurally repetitive — the same beat `type` (insight)
  # five times in a row is CORRECT here, so the archetype guard has to do the
  # anti-monotony work instead of the type guard. Tighter than explainer_5min
  # on purpose.
  min_archetypes: 4
  max_consecutive_archetype: 2

voice:
  style: storyteller

visuals:
  intensity_curve: rising   # a countdown builds toward #1
  looseness: 0.2

media:
  mode: image
  orientation: portrait


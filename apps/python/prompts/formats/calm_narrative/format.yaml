id: calm_narrative
label: "Calm narrative"
description: "Slow, reflective storytelling. Even pacing, minimal motion, breathing room. Repetition is intentional."

default_resolve_visuals: true

beats: { min: 3, max: 7 }
words_per_beat: { min: 12, max: 32 }
total_words: { max: 220 }
require_emphasis: false

# Variety gates OFF — a calm piece is SUPPOSED to hold a steady, repeating look.
variety: {}

# Genre profile — the feel, not just the words (see formats.py VoiceProfile /
# VisualProfile). storyteller voice, no HUD chip, static camera, compressed
# intensity, a little handmade jitter so it doesn't read as machine-uniform.
voice:
  style: storyteller

visuals:
  hud: none
  camera_energy: low
  intensity_curve: flat
  looseness: 0.15

# photo-led, full-bleed — explicit statement of the default (mode: image
# is behaviorally identical to "auto" today, just self-documenting).
media:
  mode: image

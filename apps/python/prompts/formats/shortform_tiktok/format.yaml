id: shortform_tiktok
label: "Short-form (TikTok / Reels)"
description: "High-retention creator opinion. Strong hook, 4-8 punchy beats, kinetic cinematics. The original MediaGen format."

default_resolve_visuals: true

beats: { min: 4, max: 8 }
# 15-30 mirrors the validator's historical runtime behaviour (the old error
# message said 15-25, but the check allowed up to 30). Tighten to 25 here if
# you want the message and the gate to finally agree.
words_per_beat: { min: 15, max: 30 }
total_words: { max: 200 }
require_emphasis: false

variety:
  min_cameras: 3
  min_paces: 2
  min_layouts: 2
  min_backgrounds: 2
  max_consecutive_camera: 2
  max_consecutive_layout: 2

# Genre profile — the feel, not just the words (see formats.py VoiceProfile /
# VisualProfile). aggressive voice, exaggerated intensity swings, and more
# handmade jitter than the default single mutator (kinetic HUD stays on).
voice:
  style: aggressive

visuals:
  intensity_curve: spiky
  looseness: 0.4

id: explainer_5min
label: "Explainer (5 minutes, sectioned)"
description: "A longer, structured explainer — intro / 2-3 body sections / conclusion — for YouTube/web. Exercises the scene/3.0 section hierarchy (sections[] with a pacing_arc each) instead of one flat beat list. Landscape."

default_resolve_visuals: true

# These bounds apply to the FLATTENED beat list (llm.py's _flatten_sections
# runs before validation — see docs/architecture/scene-3.0-schema.md's
# "Section hierarchy" note). There is no independent per-section gate yet;
# a section with 0 beats or a wildly lopsided section split still passes as
# long as the TOTAL beat count and word count land in range.
beats: { min: 18, max: 36 }
words_per_beat: { min: 12, max: 30 }
total_words: { min: 480, max: 750 }
require_emphasis: false

variety:
  min_cameras: 3
  min_paces: 2
  min_layouts: 2
  max_consecutive_camera: 3
  min_archetypes: 3
  max_consecutive_archetype: 3
  # No archetype_density / archetype_max_share here: llm.py's defaults are now
  # LENGTH-AWARE (see _default_density/_default_max_share), so an 18-36 beat
  # script already gets the long-form budget. Declare them only to override.

voice:
  style: analytical

visuals:
  intensity_curve: normal
  looseness: 0.15

media:
  mode: image
  orientation: landscape

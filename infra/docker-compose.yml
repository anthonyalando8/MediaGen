# Phase 1 local dev — Postgres + MinIO.
# P2+: IaC, queue, buckets, autoscaling (Deliverable 01).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seabytes
      POSTGRES_PASSWORD: seabytes
      POSTGRES_DB: seabytes
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: seabytes
      MINIO_ROOT_PASSWORD: seabytes-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
